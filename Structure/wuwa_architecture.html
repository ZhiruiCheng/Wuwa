<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鸣潮复刻系统地图</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1f23; --muted:#5d636d; --line:#dcd9d1; --soft:#ecebe6;
  --accent:#d24b2a; --accent-ink:#ffffff; --wire:#9aa0a8; --wire-on:#d24b2a; --panel:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --k-cpp:#2f6fde; --k-cs:#8a4fd8; --k-asset:#b8730c; --k-tool:#1f8f5a; --k-ue:#5b6573; --k-orig:#c2410c; --k-step:#0e7490; --k-concept:#b0306a; --k-learn:#8b5e34; --code:#f3f1ea;
  --devbg:#fff4e6; --devline:#f2c48d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1e2125; --ink:#e9eaec; --muted:#a2a8b1; --line:#33373d; --soft:#25292e;
    --accent:#ff7a52; --accent-ink:#1a0d08; --wire:#5f666f; --wire-on:#ff7a52; --panel:#1b1e22; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    --k-cpp:#6ea0ff; --k-cs:#b590ff; --k-asset:#f0b04a; --k-tool:#5fd19a; --k-ue:#a3adba; --k-orig:#ff8a5c; --k-step:#4cc9e0; --k-concept:#f472b6; --k-learn:#d6a77a; --code:#111316;
    --devbg:#2b2117; --devline:#6b4a25;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2125; --ink:#e9eaec; --muted:#a2a8b1; --line:#33373d; --soft:#25292e;
  --accent:#ff7a52; --accent-ink:#1a0d08; --wire:#5f666f; --wire-on:#ff7a52; --panel:#1b1e22; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --k-cpp:#6ea0ff; --k-cs:#b590ff; --k-asset:#f0b04a; --k-tool:#5fd19a; --k-ue:#a3adba; --k-orig:#ff8a5c; --k-step:#4cc9e0; --k-concept:#f472b6; --k-learn:#d6a77a; --code:#111316;
  --devbg:#2b2117; --devline:#6b4a25;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;}
code,.mono,pre{font-family:"Cascadia Code",Consolas,"SF Mono",monospace;font-size:12px;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;flex:1;min-width:0}
.crumbs button{border:0;background:none;color:var(--muted);font:inherit;padding:2px 6px;border-radius:6px;cursor:pointer}
.crumbs button:hover{background:var(--soft);color:var(--ink)}
.crumbs button.cur{color:var(--ink);font-weight:600;cursor:default;background:none}
.crumbs .sep{color:var(--line)}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:4px 10px;border-radius:8px;cursor:pointer}
.hbtn:hover{border-color:var(--accent)}
main{padding:18px max(16px,env(safe-area-inset-left)) 60px;max-width:1280px;margin:0 auto}
.head{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
.head h1{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head .intro{margin:0;color:var(--ink)}
.head .how{margin:8px 0 0;color:var(--muted);font-size:13px}
.head details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.head summary{cursor:pointer;color:var(--accent);font-size:13px}
.backbtn{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.board{position:relative;padding:4px 0 10px}
.row{position:relative;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin-bottom:58px}
.row:last-child{margin-bottom:8px}
.rlabel{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;border-right:2px solid var(--line);padding-right:10px;align-self:stretch;display:flex;align-items:center;justify-content:flex-end}
.nodes{display:flex;flex-wrap:wrap;gap:22px 26px;justify-content:center;position:relative;z-index:2}
.card{position:relative;width:212px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:10px;padding:9px 12px 10px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,border-color .12s;text-align:left;font:inherit;color:inherit}
.card:hover,.card.sel{transform:translateY(-2px);border-color:var(--kc)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .kind{font-size:11px;color:var(--kc);font-weight:600;letter-spacing:.02em}
.card .name{font-weight:700;font-size:14px;line-height:1.35;margin:1px 0 3px;word-break:break-word}
.card .what{font-size:12.5px;color:var(--muted);line-height:1.45}
.card .drill{margin-top:7px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 9px}
.card .info{margin-top:7px;font-size:12px;color:var(--muted)}
.card.wide{width:300px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.wires path{fill:none;stroke:var(--wire);stroke-width:1.4}
.wires path.on{stroke:var(--wire-on);stroke-width:2.2}
.wires path.dim,.wires text.dim{opacity:.18}
.wires text{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.wires text.on{fill:var(--wire-on);font-weight:600}
.wires .mk{fill:var(--wire)} .wires .mkon{fill:var(--wire-on)}
.wires path.back{stroke-dasharray:5 4}
.wires text.hid{opacity:0} .wires text.hid.on{opacity:1}
aside{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:40;
  transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
aside.open{transform:none}
.ptop{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ptop h2{margin:0;font-size:17px;flex:1;line-height:1.4}
.ptop .x{border:0;background:var(--soft);color:var(--ink);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;flex:none}
.pbody{overflow:auto;padding:12px 16px 30px}
.pbody h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:600}
.pbody p{margin:0 0 8px}
.pbody ul{margin:0 0 8px;padding-left:18px}
.pbody li{margin:3px 0}
.kchip{display:inline-block;font-size:11px;font-weight:600;color:var(--kc);border:1px solid var(--kc);border-radius:999px;padding:0 8px;margin-bottom:6px}
.files code{display:block;background:var(--soft);border-radius:6px;padding:4px 8px;margin:4px 0;word-break:break-all}
.dev{background:var(--devbg);border:1px solid var(--devline);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.dev b{color:var(--accent)}
.deps li button{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.goin{display:block;width:100%;margin-top:12px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:9px;border-radius:10px;cursor:pointer}
.pbody ol{margin:0 0 8px;padding-left:22px}
.pbody ol li{margin:4px 0}
.api{margin:0 0 8px}
.api div{padding:5px 0;border-bottom:1px dashed var(--line)}
.api code{display:inline-block;background:var(--soft);border-radius:5px;padding:1px 6px;margin-bottom:2px;word-break:break-all}
.cb{margin:8px 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cb .ct{font-size:12px;color:var(--muted);background:var(--soft);padding:4px 10px;border-bottom:1px solid var(--line)}
.cb pre{margin:0;padding:10px 12px;background:var(--code);overflow:auto;font:12px/1.55 "Cascadia Code",Consolas,"SF Mono",monospace;white-space:pre;tab-size:4}
.cb ul{margin:6px 10px 8px;padding-left:16px;font-size:13px}
.qa{border-left:3px solid var(--k-learn);background:var(--soft);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:13.5px}
.qa .q{font-weight:700;margin-bottom:3px}
.gl dt{font-weight:700;margin-top:10px}
.gl dd{margin:2px 0 0;color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39;display:none}
.scrim.open{display:block}
@media (max-width:720px){
  .row{grid-template-columns:1fr;gap:6px;margin-bottom:50px}
  .rlabel{justify-content:flex-start;text-align:left;border-right:0;border-left:2px solid var(--line);padding:0 0 0 8px}
  .card,.card.wide{width:100%}
  .nodes{gap:30px}
  aside{top:auto;bottom:0;height:78vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
  aside.open{transform:none}
  .brand{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="brand">鸣潮复刻 · 系统地图</div>
  <nav class="crumbs" id="crumbs" aria-label="层级"></nav>
  <button class="hbtn" id="glossBtn">术语小词典</button>
</header>
<main>
  <section class="head" id="head"></section>
  <div class="legend" id="legend"></div>
  <div class="board" id="board"></div>
</main>
<div class="scrim" id="scrim"></div>
<aside id="panel" aria-live="polite">
  <div class="ptop"><h2 id="ptitle"></h2><button class="x" id="pclose" aria-label="关闭">✕</button></div>
  <div class="pbody" id="pbody"></div>
</aside>

<script>
/* ---------- 种类 ---------- */
const KINDS = {
  group:  {t:'分层（可展开）', v:'--accent'},
  cpp:    {t:'C++ 代码', v:'--k-cpp'},
  cs:     {t:'C# 代码', v:'--k-cs'},
  asset:  {t:'UE 资产 / 数据表', v:'--k-asset'},
  tool:   {t:'工具 / 脚本 / Commandlet', v:'--k-tool'},
  ue:     {t:'UE 引擎 / 插件', v:'--k-ue'},
  orig:   {t:'原作资源', v:'--k-orig'},
  step:   {t:'制作步骤', v:'--k-step'},
  concept:{t:'概念讲解', v:'--k-concept'},
  learn:  {t:'先学的技术', v:'--k-learn'}
};

/* ---------- 节点 ----------
 k 种类  n 名字  w 一句话（是什么）  d 详细说明  f 代码/资产位置  dev 原作/改成  c 点进去的下一层 */
const N = {};
function node(id,k,n,w,o){ N[id]=Object.assign({id,k,n,w},o||{}); }

/* ===== 第 0 层：整个项目 ===== */
node('orig','orig','原作游戏文件','《鸣潮》客户端里打包好的资源和配置表，是一切数据的来源。',{
  d:['原作也是 UE 做的（UE4），资源都封在 pak 包里：模型、动画、蒙太奇、Niagara 特效、UI 预制体、LevelSequence、音频事件，还有策划配置表（ConfigDB，flatbuffer 格式）。',
     '项目原则：不凭猜测。技能时间点、伤害倍率、镜头关键帧这些数值都从原作数据里读出来，不靠肉眼估。'],
  f:['Tools/PakExport（命令行版 FModel）','Tools/.../kuro_fb.py（解 ConfigDB 配置表）']});
node('plugins','ue','引擎与第三方插件','UE 5.7 本体，加上 GAS、LGUI、UnrealSharp、Wwise 这几个大插件。',{
  d:['GAS（Gameplay Ability System）：UE 自带的技能框架，项目的技能、buff、属性都建在它上面。',
     'LGUI3：原作同款 UI 框架（用 Prefab 拼界面）。项目在 Plugins/LGUI 里打了本地补丁。',
     'UnrealSharp：让 C# 能写 UE 游戏逻辑。项目里「裁决类」逻辑（选招、步态、运动状态、相机）写在 C#。',
     'Wwise：原作同款音频中间件。'],
  dev:'<b>原作</b> 游戏逻辑用 TypeScript（Puerts 插件）写 → <b>改成</b> C#（UnrealSharp），C++ 只做反射桥和性能敏感部分。'});
node('pipeline','group','制作流程（在 UE 里怎么做）','拿到分析好的数据之后：特效、大招镜头、UI、技能在 UE 里分别怎么做、要先懂哪些技术。',{c:'pipeline'});
node('codeg','group','代码精读：为什么这样写','反射、UPROPERTY 与垃圾回收、弱引用、软引用、委托、sealed、GAS 任务、编辑器 API……初学者看不懂的写法逐个讲。',{c:'code'});
node('runtime','group','运行时系统','游戏跑起来时的所有系统：输入、角色、技能、战斗、相机、特效、UI……',{c:'runtime'});
node('tests','group','测试与调试','自动化测试、屏幕调试开关、截图对照工具、Unreal MCP。',{c:'tests'});
node('walk','group','导览：一次攻击的全过程','从「按下攻击键」到「屏幕上跳伤害数字」，按时间顺序走一遍各层。新手建议先看这个。',{c:'walk'});

/* ===== 运行时总览 ===== */
node('input','group','输入层','把键盘 / 手柄的按键翻译成「玩家想做什么」，再分发给对应系统。',{c:'input'});
node('framework','group','控制器与游戏框架','GameMode、PlayerController、相机管理器、进入世界的加载流程。',{c:'framework'});
node('formation','group','编队（切人）','3 人小队：管理谁在场、按 1/2/3 切换操控的角色。',{c:'formation'});
node('character','group','角色层','角色本体：属性、能力系统组件、移动、运动状态、动画。',{c:'character'});
node('skill','group','技能层','「出什么招、能不能出、出招时播什么动画、动画哪一帧做什么」。',{c:'skill'});
node('combat','group','战斗层','子弹、伤害结算、受击、buff、阵营、锁定、时停。',{c:'combat'});
node('camera','group','相机层','战斗跟随相机 + 大招特写镜头（Sequence）。',{c:'camera'});
node('effect','group','特效层','统一的特效播放入口：Niagara、贴花、灯光、后处理、残影、材质变化……',{c:'effect'});
node('audio','cpp','音频层（Wwise）','对 Wwise 的最小封装：按事件名播声音。',{
  d:['UWuwaWwiseAudio 对应原作 AudioSystem.PostEvent / ExecuteAction 的用法：给一个事件路径，在某个 Actor 上播。',
     '谁来调用：动画通知 AudioEvent（一次性）/ AudioEvent State（持续段）/ Footstep（脚步），以及特效层里的 Audio 类型特效。',
     '没有音频设备时（命令行、NullRHI 自动化测试）什么也不做，所以测试不会因为声音报错。'],
  f:['Source/Wuwa/Public/Game/Audio/WuwaWwiseAudio.h','Game/Animation/Notifies/WuwaAnimNotify_AudioEvent.h','Game/Animation/Notifies/WuwaAnimNotify_Footstep.h'],
  c:null});
node('ui','group','UI 层（LGUI）','界面框架（层、容器、生命周期、MVC）+ 各个业务界面（HUD、加载、Boss 血条……）。',{c:'ui'});
node('render','cpp','渲染（卡通着色）','让角色看起来像原作的卡通风格：材质自己算明暗，脸部用 SDF 阴影。',{
  d:['角色材质是 Unlit（不吃引擎光照），明暗在材质里自己算，所以需要运行时把「太阳方向、光颜色」喂给材质。',
     'UWuwaToonLightingSubsystem 每帧：找场景里的太阳光，写进材质参数集 MPC_WuwaToon；给脸部材质（UseSDF=1）写入头骨的前/右方向，用来算脸上的阴影形状。',
     '材质本身由 Commandlet 批量设置：WuwaCharacterToonSetup（卡通材质）、WuwaCharacterRimSetup（边缘光）。'],
  f:['Game/Render/WuwaToonLightingSubsystem.h','Editor/Commandlets/WuwaCharacterToonSetupCommandlet.h','ArtSource/CharacterToon']});
node('core','group','核心底座','所有层都会用到的基础服务：资源加载、对象池、Tag、调试开关、C++/C# 桥模式。',{c:'core'});

/* ===== 输入层 ===== */
node('ia','ue','Enhanced Input（IA / IMC）','UE 自带的新输入系统：InputAction（一个动作，如「攻击」）+ MappingContext（按键 → 动作）。',{
  d:['IA（InputAction）= 一个抽象动作，比如「普攻」「闪避」「跳」。IMC（InputMappingContext）= 哪个键对应哪个 IA。','长按用 Hold 触发器配置，阈值来自原作 SInputHoldConfig（触发时间、是否连续触发）。'],
  f:['Content/Characters/Input/...','Editor/Commandlets/WuwaInputHoldSetupCommandlet.h']});
node('eic','cpp','输入组件 + 输入配置','把 IA 绑定成「语义输入 Tag」，比如 Input.Combat.Attack，并带上阶段（按下 / 长按 / 松开）。',{
  d:['UWuwaEnhancedInputComponent 按 UWuwaInputDataAsset 的配置，把每个 IA 绑定好，触发时生成一条 FWuwaInputEvent：输入 Tag + 阶段 Pressed / Triggered / Released / Held。',
     '每个 Tag 还带一个 RouteTag（路由标签），决定它该交给哪个系统。'],
  f:['Game/Input/WuwaEnhancedInputComponent.h','Game/Input/DataAsset/WuwaInputDataAsset.h','Game/Input/WuwaInputTypes.h']});
node('router','cpp','输入路由 InputRouter','挂在 PlayerController 上的「分拣员」：只按 RouteTag 把输入事件交给对应处理者。',{
  d:['它本身不懂任何玩法，只看 RouteTag：Input.Route.Formation → 编队输入；技能类 → 技能输入处理；移动指令 → 移动处理；相机 → 相机；UI → UI。',
     '处理者都实现 IWuwaInputRouteHandler 接口，所以加新系统不用改路由。',
     '按键的「按住状态」不存在这里，而是写进角色的输入意图组件。'],
  f:['Game/Input/WuwaInputRouterComponent.h','Game/Input/IWuwaInputRouteHandler.h','Game/Controller/WuwaPlayerController.h']});
node('intent','cpp','输入意图 InputIntent','角色身上的「输入缓存」：记录移动方向、哪些键按着。别人写，玩法系统读。',{
  d:['对应原作每个角色身上的 CharacterInputComponent。','写入时就把原始输入「消化」好：移动轴 → FWuwaMoveIntent（方向、大小），按键 → FWuwaInputActionState（按着没、按了多久）。',
     '它不引用控制器，也不回调别人：输入来源可以是玩家、将来的 AI 或者测试代码。移动组件每帧来读。'],
  f:['Game/NewWorld/Character/Common/Component/Input/WuwaInputIntentComponent.h','.../Input/WuwaPlayerInputState.h']});
node('movecmd','cpp','移动指令处理 MoveInputHandler','处理一次性的移动指令（跳、走跑切换）：查配置表 → 执行对应的指令对象。',{
  d:['本身没有 if 按键分支：配置表 WuwaMoveInputConfig 写着「哪个 Tag → 哪个指令对象」。','指令对象：WuwaMoveInputAction_Jump（C#，跳跃，先问技能输入规则有没有跳跃类技能，例如长离空中的心眼·跃）、ToggleWalkPreference（走跑偏好）。',
     '注意：移动轴（WASD）不走这里，而是直接写进输入意图，移动组件每帧读取。'],
  f:['.../Input/WuwaMoveInputHandler.h','.../Input/WuwaMoveInputConfig.h','Script/.../Input/MoveActions/WuwaMoveInputAction_Jump.cs']});

/* ===== 制作流程（拿到数据之后在 UE 里怎么做） ===== */
node('p_premise','concept','前提：数据已经分析好','下面每条流程都从「已经分析得到的数据」开始，只讲在 UE 里用什么技术、按什么顺序做出来。',{
  d:['数据是什么样：例如嘉贝普攻第 2 段的特效 = 有几层、每层是网格还是面片、用哪张贴图、颜色怎么随时间变、活多久、多大、几时出现、挂在哪根骨骼。',
     '项目里这些数据存成 JSON「配方」（例：ArtSource/JiabeiAttack/Attack02.json）。你手工做时，就把它当成一张参数表。']});
node('p_how','concept','手工做 vs 代码做','每一步都可以在编辑器里手点，也可以写程序调用编辑器 API 批量做。项目用代码，但每行代码都对应一个手工操作。',{
  d:['流程里每一步同时给出：① 在编辑器里怎么点；② 项目代码调用的是哪个 API；③ 代码节选和「为什么这样写」。',
     '用代码做的好处：几十层特效、几十个通知一次生成，改了规则重跑一遍全部更新；也方便对照原作数据检查。',
     '用代码改资产要懂的编辑器 API（建包、撤销、保存、编辑器专用代码）见 代码精读 → 编辑器 API。'],
  qa:[['Commandlet 和在编辑器里跑有什么区别？','Commandlet 是不开编辑器界面的命令行进程，编辑器开着时它存不了盘（文件被占用），也用不到 Live Coding 刚改的代码。所以项目给特效工具同时注册了控制台命令 Wuwa.Fx.Setup，在编辑器里（或通过 Unreal MCP）跑同一份代码。']]});
node('p_fx','group','特效制作（嘉贝普攻为例）','材质 → Niagara 系统 → 特效配置 → 挂到动画 → 对照调整，再加贴花、残影、后处理这些特殊类型。',{c:'fxpipe'});
node('p_seq','group','大招镜头（Sequence）','做 LevelSequence（角色绑定 + 相机 + 关键帧）→ 挂到大招蒙太奇 → 运行时播放、切视角、混回。',{c:'seqpipe'});
node('p_ui','group','UI 界面','拼 Prefab → 组件注册表 → 登记配置表 → 写 View → Model/Controller/事件 → 打开。',{c:'uipipe'});
node('p_skill','group','一个技能（GA + 蒙太奇 + 通知）','技能表行 → GA → 授予给角色 → 输入规则 → 动画通知 → 必要时写 C++ GA。',{c:'skillpipe'});

/* ----- 特效制作 ----- */
node('fl_niagara','learn','先学：Niagara','UE 的粒子系统。一个 System（整个特效）里有多个 Emitter（层），每层 = 一群粒子 + 一种画法。',{
  d:['System（系统）：一个完整的特效资产，比如「普攻第 2 段的刀光」。场景里用 NiagaraComponent 播放它。',
     'Emitter（发射器）= 一层：这层生成多少粒子、什么时候生成、粒子怎么动。一个刀光通常 5~15 层（主刀光、碎片、光点、烟……）。',
     '模块栈（Stack）：Emitter 里从上到下排着的模块，分阶段执行：Emitter Spawn / Emitter Update（发射器自身）、Particle Spawn（每个粒子出生时一次）、Particle Update（每帧）。模块 = 改参数的小程序，例如 InitializeParticle 设寿命，SpawnBurst_Instantaneous 一次爆发 N 个。',
     '参数命名空间：Particles.*（每个粒子自己的，如 Particles.Position / Color / Lifetime）、Emitter.*、System.*、User.*（外部代码能设置的，如 SetVariableFloat）、Engine.*（引擎给的，如 Engine.Owner.Scale）。',
     'Renderer（渲染器）：粒子画成什么。Sprite = 面片（光点、火花）；Mesh = 网格（刀光弧面）；Ribbon = 丝带（武器拖尾）。',
     'CPU / GPU 模拟：粒子少用 CPU（结果确定、好调试），很多才用 GPU。嘉贝的层都用 CPU。',
     'Local Space：勾上后粒子跟着组件走（刀光跟角色）；不勾则粒子出生后留在世界里（烟留在原地）。'],
  qa:[['为什么从引擎模板复制 Emitter，而不是从空白开始？','空白 Emitter 一个模块都没有。引擎模板（OmnidirectionalBurst、SimpleSpriteBurst、Fountain）已经带好「一次爆发、初始化粒子、速度、阻力」这些常用模块，改参数比自己拼快，也不容易漏。项目代码也是从这三个模板复制的。'],
      ['模块输入框里填的数字存在哪？','存在脚本的 RapidIterationParameters（快速迭代参数）里，名字形如 Constants.发射器名.SpawnBurst_Instantaneous.Spawn Count。改它不用重新生成整张图，所以叫「快速迭代」。代码批量改参数就是改这里。']]});
node('fl_mat','learn','先学：特效材质','特效材质几乎都是 Unlit（不受光照）：颜色写进 Emissive（自发光），透明度写进 Opacity。',{
  d:['Shading Model = Unlit：特效自己发光，不需要灯照。',
     'Blend Mode：Additive（叠加，越叠越亮，适合光和火花）；Translucent（半透明，能把画面变暗，适合烟和暗色圆盘）；Masked（要么画要么不画，按 Opacity Mask 和阈值裁掉，便宜）。',
     '粒子专用输入节点：Particle Relative Time（粒子年龄 0→1）、Vertex Color（Niagara 传来的 Particles.Color，含透明度）、Particle Random（每个粒子一个随机数）、Dynamic Parameter（Niagara 传来的 4 个自定义数）。',
     'Custom 节点：直接写一段 HLSL（着色器代码），复杂公式写成代码比连几十个节点清楚。',
     'World Position Offset（WPO）：在顶点着色器里挪顶点，可以做「面片随寿命缩放」这种效果。',
     'Usage 开关：材质要勾 Used with Niagara Sprites / Mesh Particles / Ribbons，否则用在对应渲染器上显示默认格子材质。',
     '软粒子（Depth Fade）：用场景深度减像素深度，让面片插进地面处边缘变柔。Masked / 不透明材质读不到场景深度。'],
  qa:[['刚建好的特效是灰色或格子？','着色器还在后台编译，编完前用默认材质。项目的截图测试会先等 FinishAllCompilation。'],
      ['Additive 和 Translucent 怎么选？','看原作材质实例：MI_Add_* 就是叠加。叠加不能把画面变暗，所以暗色圆盘这类层必须用半透明。']]});
node('fl_model','learn','先学：项目的特效配置','Niagara 系统只是素材；什么时候开始、播多久、怎么动由项目的 EffectModel 资产描述（照原作 EffectModelBase）。',{
  d:['DA_Fx_* = UWuwaEffectModelNiagara：引用 Niagara 系统 + StartTime + Location / Rotation / Scale 曲线 + User 参数曲线。',
     'Group（UWuwaEffectModelGroup）：把多个 Model 打包，各自带延迟一起播。动画通知引用的是 Group。',
     '为什么多这一层：同一个 Niagara 系统可以被不同技能用不同大小 / 时长复用；原作就这么组织，数据可以一一对上。'],
  qa:[['两个角色同时放同一招，共享的 Model 会不会互相影响？','不会。Model 只读；播放状态（组件、已播时间）在运行时的 Spec 对象里，每次播放一个 Spec。这就是 Model / Spec 分开的原因。']]});
node('fl_notify','learn','先学：动画通知','蒙太奇时间轴上的标记：动画播到那一帧，引擎调用通知对象的 Notify()。PlayEffect 就是一个通知类。',{
  d:['Notify（一次）和 NotifyState（NotifyBegin / Tick / End 持续一段）。',
     '通知对象是蒙太奇的子对象（Outer 是蒙太奇），它的属性（Model、骨骼、偏移）跟着蒙太奇一起保存。']});
node('fd_data','concept','已分析的数据（一段攻击）','每层：网格或面片、贴图、颜色曲线、混合方式、寿命、数量、大小、出生位置 / 速度、出现时间；整体：挂点骨骼、偏移、是否跟随。',{
  d:['例：Dg_02_2 刀光层 = 网格粒子，缩放 (3.5, 3.5, 2)，寿命 0.2 秒，透明度 ×0.1，绕 Z 轴转 16π。']});
node('fs_mat','step','1. 每层做一个材质','新建 Unlit 材质 → 设混合方式 → Custom 节点写颜色 / 透明度公式 → 接到 Emissive 和 Opacity。',{
  steps:['内容浏览器右键 → Material，命名 M_<层名>。',
     'Details：Shading Model = Unlit；Blend Mode 按数据；勾 Two Sided（刀光两面都要看得到）。',
     'Usage：勾 Used with Niagara Sprites 或 Used with Niagara Mesh Particles（看这层用哪种渲染器）。',
     '放输入节点：TextureCoordinate（UV）、Particle Relative Time（年龄）、Vertex Color、Particle Random；贴图用 Texture Object Parameter。',
     '放一个 Custom 节点，Output Type = Float4，把上面的节点接成它的输入（UV、Age、VertexColor、VertexAlpha…），代码里算出 RGBA。',
     '用 Component Mask 把输出拆成 RGB → Emissive Color，A → Opacity（Masked 则接 Opacity Mask 并设 Clip Value）。',
     '加一个 Scalar Parameter「Intensity」控制亮度，之后好调。'],
  api:[['UMaterial::BlendMode、SetShadingModel(MSM_Unlit)','就是 Details 面板那两个下拉框。'],
       ['UMaterialExpressionCustom','Custom 节点：Code 字段是 HLSL，Inputs 是输入引脚。'],
       ['UMaterialExpressionParticleRelativeTime 等','各个粒子输入节点对应的类。'],
       ['GetEditorOnlyData()->EmissiveColor.Connect(0, Node)','把节点连到材质主节点的 Emissive 引脚。'],
       ['PreEditChange / PostEditChange','改材质前后调用；PostEditChange 触发着色器重新编译。']],
  code:[{t:'Editor/Effects/WuwaReferenceAssetImport.cpp · BuildMaterial（节选）',c:String.raw`M->PreEditChange(nullptr);
M->GetExpressionCollection().Empty();          // 重建：先清空旧节点
M->BlendMode = Blend == TEXT("additive") ? BLEND_Additive
             : Blend == TEXT("masked")   ? BLEND_Masked : BLEND_Translucent;
M->SetShadingModel(MSM_Unlit);
M->TwoSided = true;
M->bUsedWithNiagaraSprites = bSprite;
M->bUsedWithNiagaraMeshParticles = !bSprite && !bRibbon;
auto* Art = Expression<UMaterialExpressionCustom>(M);
Art->OutputType = CMOT_Float4;
Input(Art, TEXT("UV"), UV);
Input(Art, TEXT("Age"), Age);
Input(Art, TEXT("VertexAlpha"), Color, 4);    // 4 = VertexColor 节点的 A 输出
// ……
M->GetEditorOnlyData()->EmissiveColor.Connect(0, RGB);
M->GetEditorOnlyData()->Opacity.Connect(0, Alpha);
M->PostEditChange();                           // 触发重新编译`,
     n:['GetEditorOnlyData()：材质的节点图只在编辑器里存在，打包后的游戏里只有编译好的着色器，所以连线数据放在 EditorOnlyData 里。',
        'Connect(0, Node) 的 0 是源节点的第几个输出引脚。VertexColor 节点有 RGB/R/G/B/A 五个输出，A 是第 4 个（从 0 数）。']}],
  qa:[['为什么用 Custom 节点写 HLSL，而不是连节点？','原作材质逻辑是从编译后的着色器反推的，本身就是一段公式（UV 旋转 → 平铺 → 平移 → 采样 → 颜色 ramp → 溶解）。写成代码能一行行对照；连节点要几十个，看不清。代价是 Custom 节点不能逐节点预览，引擎也不帮你优化。'],
      ['DX12 下 Custom 代码报错？','SM6 不接受「向量三元运算」（cond ? float3 : float3），用 step() / lerp() 代替。项目踩过这个坑。'],
      ['为什么要 Two Sided？','刀光是一片弧面，镜头转到背面时单面材质会消失。']]});
node('fs_sys','step','2. 搭 Niagara 系统','新建 System → 每层加一个 Emitter（从模板复制）→ 改模块参数 → 换渲染器和材质 → 编译。',{
  steps:['内容浏览器右键 → FX → Niagara System，选空系统。',
     '加 Emitter：网格层从 SimpleSpriteBurst 模板加（之后换成 Mesh 渲染器），面片层从 OmnidirectionalBurst，拖尾层从 Fountain（换成 Ribbon 渲染器）。',
     'Emitter Properties：Sim Target = CPU；Local Space 按数据；勾 Determinism 并填 Random Seed（每次播放一样，方便对照）；Bounds 改 Fixed。',
     'Emitter State：只播一次，Loop Duration = 出生时间 + 最大寿命。',
     'Spawn Burst Instantaneous：Spawn Count = 数量（网格层 1 个），Spawn Time = 延迟。',
     'Initialize Particle：Lifetime、颜色、大小；Shape Location / Add Velocity 按数据，不需要就设 0。',
     'Particle Update：Drag、Gravity；模板自带但数据里没有的模块（如 ScaleSpriteSize）取消勾选。',
     'Render：删掉模板渲染器，加 Sprite / Mesh / Ribbon Renderer，设材质（Mesh 用 Override Materials）、网格、Sort Order（层的前后）。',
     '数据里的特殊值（如出生朝向）：在 Particle Spawn 最后加 Set Parameters 模块，用 HLSL 表达式赋值。',
     '点 Compile，没有报错再保存。'],
  api:[['FNiagaraEditorUtilities::AddEmitterToSystem','= 系统里点「+ Emitter」选模板。'],
       ['FVersionedNiagaraEmitterData','Emitter 某个版本的全部设置（Local Space、Sim Target、各阶段脚本、渲染器）。Niagara 的 Emitter 有版本，要先取这份数据再改。'],
       ['Script->RapidIterationParameters.SetParameterValue','改模块输入框里的常量。'],
       ['FNiagaraStackGraphUtilities::SetModuleIsEnabled','模块左边那个勾。'],
       ['FNiagaraStackGraphUtilities::AddParameterModuleToStack','加 Set Parameters 模块。'],
       ['UNiagaraSprite / Mesh / RibbonRendererProperties','三种渲染器，字段就是渲染器面板上的那些。'],
       ['System->RequestCompile(true) + WaitForCompilationComplete','点 Compile 并等它编完。']],
  code:[{t:'Editor/Effects/WuwaReferenceNiagaraBuilder.cpp · ConfigureEmitter（节选）',c:String.raw`FVersionedNiagaraEmitterData* Data = Handle.GetEmitterData();
Data->RemoveParent();              // 断开与模板的继承：之后改模板不影响这里
Data->bLocalSpace = Spec.bLocalSpace;
Data->bDeterminism = true;         // 固定随机：每次播放一样
Data->RandomSeed = Spec.RandomSeed;
Data->SimTarget = ENiagaraSimTarget::CPUSim;
Data->CalculateBoundsMode = ENiagaraEmitterCalculateBoundMode::Fixed;
Data->FixedBounds = FBox(FVector(-600), FVector(600));
SetRapid(*Data, TEXT(".SpawnBurst_Instantaneous.Spawn Count"), bSprite ? Spec.Count : 1);
SetRapid(*Data, TEXT(".EmitterState.Loop Duration"),
         Spec.SpawnTime + FMath::Max(Spec.Lifetime, Spec.LifetimeMax) + .025f);`,
     n:['SetRapid 按名字「结尾」匹配参数，因为完整名字里带着发射器名，每层不一样。',
        'Loop Duration 多加 0.025 秒：给最后出生的粒子留一帧，避免发射器先结束把它截掉。']},
     {t:'同文件 · Mesh 渲染器',c:String.raw`auto* Renderer = NewObject<UNiagaraMeshRendererProperties>(Instance.Emitter, NAME_None, RF_Transactional);
Renderer->Meshes.SetNum(1);
Renderer->Meshes[0].Mesh = Spec.Mesh;
Renderer->SortOrderHint = Spec.SortOrder;   // 半透明层之间的前后顺序
Renderer->bOverrideMaterials = true;        // 不用网格自带材质，用第 1 步做的
Renderer->OverrideMaterials.SetNum(1);
Renderer->OverrideMaterials[0].ExplicitMat = Spec.Material;
Instance.Emitter->AddRenderer(Renderer, Instance.Version);`,
     n:['NewObject 第一个参数是 Outer（所属对象）：渲染器属于这个 Emitter，跟着它保存。','RF_Transactional：参与撤销（Ctrl+Z）。']}],
  qa:[['为什么每层都是一次爆发，不用持续发射？','原作攻击特效几乎都是一次性的（0.2 秒的刀光、50 毫秒的火花）。原作按时间持续出生的层，项目按「同一时刻出生的粒子」拆成多个 Emitter，各自在自己的 Spawn Time 爆发，效果一样，还能逐个粒子对上原作数据。'],
      ['Bounds 为什么要固定？','包围盒决定特效什么时候被视锥剔除（看不见就不画）。动态计算要每帧扫一遍粒子，一次性小特效没必要；但太小会让镜头一偏特效就消失，所以给了 ±6 米。'],
      ['网格层为什么把轴心折进 WPO？','Niagara 会把网格的轴心偏移乘上粒子缩放，而项目的缩放曲线在材质 WPO 里做，两边对不上就出现 9 米长的「针」。所以轴心放进 WPO、渲染器轴心设 0。嘉贝开枪那两条长线就是这个原因。']]});
node('fs_model','step','3. 做特效配置资产','每个 Niagara 系统配一个 DA_Fx_*（Niagara Model）和一个 Group；整体缩放、位移、播放中的旋转写在这里。',{
  steps:['内容浏览器右键 → Miscellaneous → Data Asset → 选 WuwaEffectModelNiagara，命名 DA_Fx_<角色>_<阶段>_<名字>。',
     '填 NiagaraRef（第 2 步的系统）、StartTime、Location / Rotation / Scale（常量；要随时间变就勾 bUseCurve 编辑曲线）。',
     '再建一个 WuwaEffectModelGroup，EffectData 里加上这个 Model（值 = 延迟秒数）。'],
  api:[['FWuwaEffectVectorCurve','一个常量 + 三条 FRichCurve（X/Y/Z）。bUseCurve = false 时只用常量。'],
       ['FRichCurve::AddKey、RCIM_Cubic、RCTM_User','加关键帧，三次插值，切线手动给（用原作曲线的切线值）。'],
       ['UObject::Modify()','改资产前调用：记录撤销，并把包标记为已修改。']],
  code:[{t:'Commandlets/WuwaChangliAttackEffectSetupCommandlet.cpp（节选）',c:String.raw`Niagara->Modify();
Niagara->NiagaraRef = System;
Niagara->StartTime = StartTime;
Niagara->Scale = FWuwaEffectVectorCurve(FVector(ModelScale ? *ModelScale : 1.f));
if (!P.YawKeys.IsEmpty())
{
    Niagara->Rotation.bUseCurve = true;     // 播放中绕 Z 轴转（原作子 DA 的 Rotation 曲线）
    FRichCurve& Curve = Niagara->Rotation.CurveZ.EditorCurveData;
    for (const FYawKey& Key : P.YawKeys)
    {
        FRichCurveKey& Added = Curve.GetKey(Curve.AddKey(Key.Time, Key.Value));
        Added.InterpMode = RCIM_Cubic;
        Added.TangentMode = RCTM_User;
        Added.ArriveTangent = Key.ArriveTangent;
        Added.LeaveTangent = Key.LeaveTangent;
    }
}
Group->EffectData.Add(Niagara, 0.f);`,n:[]}]});
node('fs_notify','step','4. 挂到技能蒙太奇','打开蒙太奇 → 在数据时间点加 PlayEffect 通知 → 选 Group、骨骼、偏移、是否跟随。',{
  steps:['双击打开蒙太奇（例：AM_Jiabei_Attack02）。',
     'Notifies 轨道右键 → Add Notify → Wuwa Anim Notify Play Effect。',
     '拖到数据里的时间；Details 填 Model（Group 资产）、Socket Name、Location / Rotation Offset、Scale、Follow。',
     '特效通知单独放一条轨道（项目叫 Effect，橙色），和技能节奏的通知分开，好找。'],
  api:[['FAnimNotifyEvent::Link(Montage, Time)','把通知放到蒙太奇某个时间（会算出它属于哪个片段）。'],
       ['Montage->SortNotifies() / RefreshCacheData()','加完后排序、刷新缓存。'],
       ['FAnimNotifyEvent::RefreshTriggerOffset','重算触发偏移，不做的话第 0 帧的通知不会触发（见 代码精读）。']],
  code:[{t:'运行时 · Notifies/WuwaAnimNotify_PlayEffect.cpp',c:String.raw`void UWuwaAnimNotify_PlayEffect::Notify(USkeletalMeshComponent* MeshComp, ...)
{
    UWuwaEffectSystem* Effects = UWuwaEffectSystem::GetEffectSystem(MeshComp);
    if (!Effects) return;              // 动画编辑器的预览世界没有特效系统
    FWuwaEffectSpawnRequest Request;
    Request.Model = Model;
    const FTransform Offset(RotationOffset, LocationOffset, Scale);
    const FTransform Socket = MeshComp->GetSocketTransform(SocketName);
    if (bFollow)
    {   // 挂上去后父级缩放还会作用在相对变换上：先除掉插槽缩放
        Request.AttachTo = MeshComp;
        Request.SocketName = SocketName;
        Request.Transform = Offset * FTransform(FQuat::Identity, FVector::ZeroVector, Undo);
    }
    else
        Request.Transform = Offset * FTransform(Socket.GetRotation(), Socket.GetLocation());
    Effects->SpawnEffect(Request);     // 短表现：播完系统自己回收，不持有句柄
}`,
     n:['FTransform 相乘：A * B = 先做 A，再做 B（A 在 B 的空间里）。Offset * Socket 就是「在骨骼的空间里偏移」。',
        '故意丢掉骨骼的缩放：模型导入时根骨骼带了 100 倍缩放，直接用会让特效大 100 倍、偏移远 100 倍。']}],
  qa:[['为什么在动画编辑器里预览蒙太奇看不到特效？','特效系统 UWuwaEffectSystem 的 DoesSupportWorldType 只在 Game / PIE 世界创建，动画编辑器的预览世界没有它，通知直接 return。要看效果得 PIE 或跑截图测试。'],
      ['Follow 选哪个？','刀光、身上的光：跟随；地上的裂纹、留在原地的烟：不跟随。对应原作数据的 Attached（默认 true）。']]});
node('fs_tune','step','5. 看效果、对照、调','PIE 放技能看整体；用截图工具在同一时刻截图和原作视频比；不对就回去改材质或模块参数。',{

node('sl_seq','learn','先学：Sequencer','LevelSequence 是时间轴资产：Binding（绑定的对象）下挂 Track（轨道），轨道里是 Section（片段），片段里是 Channel（通道）上的关键帧。',{
  d:['例：相机绑定 → Transform 轨道 → 一个 Section → 9 个 Channel（位置 XYZ、旋转 XYZ、缩放 XYZ），每个 Channel 上一串关键帧。',

node('sl_bind','learn','先学：借用 / 自带 / 绑定 Tag','Possessable = 借用场景里已有的对象；Spawnable = 序列播放时自己生成的对象；Binding Tag 让代码运行时换掉绑定的对象。',{

     '相机绑定打 Tag「SequenceCamera」，运行时按 Tag 找到生成出来的相机。']});
node('sl_cam','learn','先学：视角切换','屏幕看的是 PlayerController 的 ViewTarget。切镜头 = SetViewTargetWithBlend(新相机, 混合时间)。',{

node('ss3','step','3. 加相机 + 关键帧','加 CineCamera 并转成 Spawnable、打 Tag「SequenceCamera」，按数据打 Transform 和焦距关键帧，需要时加 Attach 轨道挂到角色骨骼。',{
  steps:['+ Track → Cine Camera Actor；绑定右键 → Convert to Spawnable。','绑定打 Tag：SequenceCamera。','Transform 轨道按数据逐帧打位置 / 旋转；CineCameraComponent → Current Focal Length 轨道打焦距。','相机要跟着角色某根骨骼：加 Attach 轨道，选角色绑定和 Socket。','Spawn 轨道：控制相机什么时候存在。','（嘉贝大招）序列里还可以放 Niagara 的 Spawnable 播特效。'],
  api:[['UMovieScene::AddSpawnable / AddPossessable','加自带 / 借用的绑定。'],
       ['MovieScene->AddTrack<UMovieScene3DTransformTrack>(Guid)','给绑定加 Transform 轨道。'],
       ['Track->CreateNewSection() + Section->SetRange(TRange<FFrameNumber>::All())','新建片段，范围无限（整段都生效）。'],
       ['Section->GetChannelProxy().GetChannels<FMovieSceneDoubleChannel>()','取出片段里的通道（Transform 用 double）。'],
       ['Channel.GetData().AddKey(FFrameNumber, Value)','打一个关键帧。'],
       ['UMovieScene3DAttachTrack::AddConstraint','Attach：一段时间挂到某个绑定的骨骼上。']],
  code:[{t:'WuwaAnimationEditor/.../WuwaSequenceCameraSetupCommandlet.cpp（节选）',c:String.raw`UMovieScene3DTransformTrack* Track = MovieScene->AddTrack<UMovieScene3DTransformTrack>(Guid);
UMovieScene3DTransformSection* Section =
    Cast<UMovieScene3DTransformSection>(Track->CreateNewSection());
Section->SetRange(TRange<FFrameNumber>::All());
TArrayView<FMovieSceneDoubleChannel*> Channels =
    Section->GetChannelProxy().GetChannels<FMovieSceneDoubleChannel>();
for (int32 Index = 0; Index < Channels.Num(); ++Index)
    FillChannel<FMovieSceneDoubleChannel, FMovieSceneDoubleValue>(*Channels[Index], Defs[Index]->AsObject());
Track->AddSection(*Section);`,n:['Channel 顺序固定：位置 X/Y/Z、旋转 X/Y/Z、缩放 X/Y/Z。','CreateNewSection 只是创建，必须 AddSection 才真正放进轨道。']}]});
node('ss4','step','4. 挂到大招蒙太奇','切镜头那一帧加 SequenceCamera 通知，填序列、混入 / 混出时间、隐藏 HUD、只播多久、挂点骨骼。',{
  qa:[['配置里的序列为什么是软引用（TSoftObjectPtr）？','通知是蒙太奇的一部分。硬引用会让加载蒙太奇时把序列以及序列引用的相机、特效、网格全部加载进内存；软引用只存路径，用的时候再加载。']]});
node('ss5','cpp','5. 运行时播放','通知 → SequenceCameraSubsystem：生成原点 Actor 挂到角色骨骼 → 创建序列播放器 → 绑定角色 → 播放 → 找到相机 → 切视角。',{
  api:[['ULevelSequencePlayer::CreateLevelSequencePlayer','在世界里生成 ALevelSequenceActor 和播放器。'],
       ['FMovieSceneSequencePlaybackSettings::bDisableCameraCuts','不让序列自己的 Camera Cut 切视角。'],
       ['UDefaultLevelSequenceInstanceData::TransformOriginActor','序列原点 = 这个 Actor（先设 bOverrideInstanceData = true）。'],
       ['ALevelSequenceActor::SetBindingByTag','把带 Tag 的绑定换成指定对象。'],
       ['FindNamedBindings + GetBoundObjects','按 Tag 找绑定，再取运行时它实际对应的对象（生成出来的相机）。'],
       ['APlayerController::SetViewTargetWithBlend','画面切到这个相机，带混合时间。']],
  code:[{t:'Game/Camera/WuwaSequenceCameraSubsystem.cpp · PlayCameraSequence（节选）',c:String.raw`APlayerController* PC = Cast<APlayerController>(InCharacter->GetController());
if (!PC || !PC->IsLocalController()) return false;   // 只给本机玩家切镜头
AActor* OriginActor = World->SpawnActor<AActor>(AActor::StaticClass(), InCharacter->GetActorTransform(), Params);
USceneComponent* Root = NewObject<USceneComponent>(OriginActor, TEXT("Root"));
OriginActor->SetRootComponent(Root);
Root->RegisterComponent();
Root->AttachToComponent(Mesh, FAttachmentTransformRules::SnapToTargetNotIncludingScale, AttachSocket);

FMovieSceneSequencePlaybackSettings Settings;
Settings.bDisableCameraCuts = true;      // 视角由这里切（混合时间同原作）
ALevelSequenceActor* SequenceActor = nullptr;
ULevelSequencePlayer::CreateLevelSequencePlayer(World, Asset, Settings, SequenceActor);
SequenceActor->bOverrideInstanceData = true;
if (auto* Data = Cast<UDefaultLevelSequenceInstanceData>(SequenceActor->DefaultInstanceData))
    Data->TransformOriginActor = OriginActor;
SequenceActor->SetBindingByTag(WuwaSequenceCamera::RoleTag, { InCharacter }, false);
SequenceActor->GetSequencePlayer()->Play();
for (const FMovieSceneObjectBindingID& Binding : SequenceActor->FindNamedBindings(WuwaSequenceCamera::CameraTag))
    for (UObject* Bound : SequenceActor->GetSequencePlayer()->GetBoundObjects(Binding))
        if (AActor* Camera = Cast<AActor>(Bound)) CameraActor = Camera;
if (AActor* Camera = CameraActor.Get()) PC->SetViewTargetWithBlend(Camera, Current.BlendInTime);`,
     n:['NewObject 出来的组件要 RegisterComponent() 才会进入世界（参与变换更新、渲染）。在构造函数外动态加组件都要这一步。',
        'SnapToTargetNotIncludingScale：位置旋转对齐到骨骼，但不继承缩放（根骨骼有 100 倍缩放）。']}],
  qa:[['为什么另外生成一个「原点 Actor」，不直接用角色？','原点要对齐到指定骨骼，而且不能带缩放，所以单独生成一个空 Actor 挂上去当原点。'],
      ['为什么关掉序列自己的 Camera Cut？','序列的 Camera Cut 是硬切。原作有混入 / 混出时间，所以由代码用 SetViewTargetWithBlend 控制。'],
      ['为什么 Tick 里还要再找一次相机？','Spawnable 在序列第一次求值时才生成，Play() 之后不一定马上有。找不到就每帧补找一次。'],
      ['成员为什么用 TWeakObjectPtr 存序列 Actor、相机、角色？','这些 Actor 属于世界，随时可能被销毁（切地图、角色死亡）。子系统只是「看着」它们，不该让它们活着。弱指针在对象销毁后自动变无效，Get() 返回空，不会访问野指针。'],
      ['为什么只给本地控制的角色播？','镜头是本机表现，别人的角色放大招不该切你的镜头。原作 CheckCameraSequenceCondition 也是这样。']]});
node('ss6','cpp','6. 结束、混回、清理','到时长后先暂停，SetViewTargetWithBlend 混回角色；混合结束再 Stop、销毁序列 Actor 和原点，恢复 HUD。',{
  code:[{t:'同文件 · StopSequence（节选）',c:String.raw`if (ULevelSequencePlayer* Player = Sequence->GetSequencePlayer()) Player->Pause();
if (PC && PC->GetViewTarget() == CameraActor.Get())
    PC->SetViewTargetWithBlend(Owner, bImmediate ? 0.f : Current.BlendOutTime);
if (bImmediate || Current.BlendOutTime <= 0.f) Cleanup();
else BlendOutUntil = PlayTime + Current.BlendOutTime;   // Tick 里到时间再 Cleanup`,n:[]}],
  qa:[['为什么混出时先 Pause，不直接 Stop？','Stop 会让序列收回它生成的相机。混合还没结束相机就没了，画面会跳。所以先暂停停在最后一帧，等混合时间过去再在 Cleanup 里 Stop 和销毁。'],
      ['隐藏 HUD 是怎么做的？','拿到主 HUD 界面的根 UIItem，SetIsUIActive(false)，时间到再设回 true。不是关闭界面，所以 HUD 的状态不会丢。']]});

node('ul_lgui','learn','先学：LGUI','LGUI 的 UI 是场景里的一堆 Actor + 组件；UIItem 是所有 UI 节点的基础组件，Prefab 是一棵节点树的模板。',{
  d:['UIItem：节点（位置、尺寸、锚点、父子关系）。UISprite / UITexture / UIText：图片、贴图、文字。',
     'LGUICanvas：一棵 UI 树的根，决定渲染方式（屏幕空间 / 世界空间）和排序。',
     'Prefab（ULGUIPrefab）：一棵 Actor 树的模板，LoadPrefab 一次实例化出整棵树。',
     '锚点（Anchor）：节点相对父节点哪个点对齐、是否拉伸。适配不同分辨率靠它。'],
  qa:[['LGUI 和 UE 自带的 UMG 有什么区别？','UMG 是 Slate 控件树；LGUI 是场景里的 Actor + 组件，能做 3D UI、直接放 Niagara、和场景物体一起排序。原作用的就是 LGUI，要按原作 Prefab 1:1 还原只能用它。']]});
node('ul_load','learn','先学：软引用与异步加载','TSoftObjectPtr 只存资源路径，不会自动加载；要用时异步加载，加载完的回调里再用。',{
  d:['硬引用（UPROPERTY 直接指向资产）：加载引用方时，被引用的资产也一起加载。',
     '软引用（TSoftObjectPtr / FSoftObjectPath）：只是一个路径。配置表里存几十个界面的 Prefab，用硬引用会让游戏一开始就把所有界面都读进内存。',
     '同步加载 LoadSynchronous：卡住游戏线程直到读完磁盘。异步加载：后台读，完成后回调。',
     '项目统一用 UWuwaResourceSubsystem::LoadAsync（内部是 FStreamableManager），返回 FStreamableHandle，可以查进度、取消。']});
node('ul_mvc','learn','先学：MVC 与事件','View 只管显示，Model 只存数据，Controller 写逻辑；三者通过事件联系，不直接互相调用。',{
  d:['事件子系统 UWuwaEventSubsystem：Emit(事件 Tag, 参数) 发出，按 Tag 监听。参数是任意 USTRUCT，用 FInstancedStruct 装着。',
     '好处：战斗系统不用 include 任何 UI 头文件；HUD 没打开时事件发了也没人收，不会出错。'],
  code:[{t:'Game/LGUI/Mvc/WuwaEventSubsystem.h',c:String.raw`using FWuwaEventHandler = TFunction<void(const FInstancedStruct& Payload)>;

void Emit(FGameplayTag Event, const FInstancedStruct& Payload = FInstancedStruct());
template <typename T>
void Emit(FGameplayTag Event, const T& Payload) { Emit(Event, FInstancedStruct::Make(Payload)); }`,
     n:['模板重载：调用方直接传自己的结构体，模板帮它包成 FInstancedStruct。']}],
  qa:[['FInstancedStruct 是什么？','一个能装任意 USTRUCT 的盒子：里面记着结构体类型和数据。接收方用 Payload.GetPtr<FMyEvent>() 取出来，类型不对返回空。一个事件系统就能传各种参数，不用为每种事件写一个委托。'],
      ['事件名为什么用 GameplayTag 而不是字符串？','Tag 要先登记，拼错会找不到（有校验）；比较是整数比较，比字符串快；编辑器里能下拉选。']]});
node('ul_sub','learn','先学：Subsystem（子系统）','UE 自动创建、自动销毁的单例服务，按「跟着谁活」分几种。',{
  d:['UWorldSubsystem：每个世界一份，切地图销毁重建。例：特效系统、伤害、战斗单位登记表。',
     'UTickableWorldSubsystem：同上，还每帧 Tick。例：序列镜头、子弹、对象池、卡通光照。',
     'UGameInstanceSubsystem：整个游戏进程一份，切地图不销毁。例：资源加载、事件。',
     'ULocalPlayerSubsystem：每个本地玩家一份。例：UI 管理器。',
     '获取：World->GetSubsystem<T>()、GameInstance->GetSubsystem<T>()、LocalPlayer->GetSubsystem<T>()。'],
  code:[{t:'Game/Effect/System/WuwaEffectSystem.cpp',c:String.raw`bool UWuwaEffectSystem::DoesSupportWorldType(EWorldType::Type WorldType) const
{
    return WorldType == EWorldType::Game || WorldType == EWorldType::PIE;
}`,n:['编辑器里有很多「世界」：关卡编辑器、动画编辑器预览、材质预览……这个重写让特效系统只在游戏和 PIE 里创建。']}],
  qa:[['UiManager 为什么是 LocalPlayerSubsystem？','UI 属于某个玩家（分屏时每人一套），而且切地图不应该销毁 UI 框架本身。但界面 Actor 属于旧世界会被销毁，所以它监听 OnWorldCleanup 先关界面，PostLoadMapWithWorld 之后重开常驻界面。'],

node('us4','step','4. 写 View 类','继承 UWuwaUiView，在生命周期函数里写逻辑：OnCreate 取控件、OnAddEventListener 订阅事件、OnBeforeShow / OnAfterHide……',{
  d:['状态：None → Creating → Created → Starting → Started → Showing → Shown → Hiding → Hidden → Destroying → Destroyed。框架推进状态，View 只在对应虚函数里写自己的逻辑。',
     '别在构造函数里碰控件：那时 Prefab 还没加载。','OnStartAsync(Done)：需要异步准备数据时用，准备好了调用 Done。'],
  code:[{t:'Game/LGUI/View/WuwaUiPanel.cpp · 加载 Prefab（节选）',c:String.raw`// LGUI 没有异步实例化：先异步加载预制体资源，回来再同步 LoadPrefab。
TWeakObjectPtr<UWuwaUiPanel> WeakThis(this);
LoadHandle = Resources->LoadAsync({Prefab.ToSoftObjectPath()}, FString::Printf(TEXT("UI:%s"), *GetClass()->GetName()),
    [WeakThis, Prefab, Parent, OnDone]()
    {
        UWuwaUiPanel* Self = WeakThis.Get();
        if (!Self) return;                 // 加载回来时界面已经没了
        Self->HandlePrefabLoaded(Prefab, Parent, OnDone);
    }, UWuwaResourceSubsystem::HighPriority);

// HandlePrefabLoaded 里：
LoadHandle.Reset();                        // 加载完就不需要句柄了
AActor* NewRootActor = LoadedPrefab->LoadPrefab(ParentItem->GetWorld(), ParentItem, true);`,n:[]}],
  qa:[['为什么先异步加载资源，再同步 LoadPrefab？','LGUI 只有同步实例化。慢的是读磁盘，放后台；实例化必须在游戏线程做，资源已经在内存里，同步也很快。'],
      ['回调为什么捕获 WeakThis，不捕获 this？','加载要好几帧，期间界面可能已被关闭、对象被回收。捕获裸 this 的话回调执行时访问已释放内存会崩溃；弱指针 Get() 返回空就直接 return。'],
      ['LoadHandle 为什么加载完就 Reset？','句柄持有资源引用，防止资源被回收。加载完之后资源由 Prefab 实例引用，句柄就没用了，留着会一直占内存。']]});

node('us6','step','6. 打开界面','UWuwaUiManager::Get(this)->OpenView(界面名)：查配置 → 检查规则 → 创建 View → 交给所在层的容器。',{

node('kl_gas','learn','先学：GAS','UE 的技能框架：ASC（挂在角色上的总管）、GA（技能逻辑）、GE（效果 / buff）、GameplayTag（状态标签）、AttributeSet（数值）。',{
  d:['GA 的一生：先被「授予」给 ASC（GiveAbility，得到一个 Spec 句柄）→ 尝试激活（CanActivate 检查）→ ActivateAbility → 用任务等待各种事件 → EndAbility。',
     'Instancing Policy（实例策略）：InstancedPerExecution = 每次激活新建一个 GA 对象；InstancedPerActor = 每个角色一个。项目的主技能用前者，同一技能正在放时还能被自己再次触发（连段）。',

node('kl_montage','learn','先学：蒙太奇与根运动','技能动作都是蒙太奇；根运动让动画自己决定角色移动多远。',{

node('ks3','cpp','3. 授予给角色','角色初始化时遍历技能表，每一行 GiveSkill：把 GA 授予给 ASC，并记下技能 ID → Spec 句柄。',{
  code:[{t:'Abilities/WuwaAbilitySystemComponent.cpp · GiveSkill',c:String.raw`FGameplayAbilitySpecHandle UWuwaAbilitySystemComponent::GiveSkill(int32 SkillId, const FWuwaSkillInfo& Info, UObject* SourceObject)

    if (SkillId <= 0 || !Info.Ability || GrantedSkills.Contains(SkillId)) return FGameplayAbilitySpecHandle();

node('ks6','cpp','6. 需要时写 C++ GA','通用 GA 表达不了的才写：例如空中闪避要「先加 buff 再播、落地时按着方向就接冲刺」。',{

node('cr_uclass','cpp','UCLASS / GENERATED_BODY：反射','UE 编译前用 UHT 扫描头文件，给带 UCLASS / USTRUCT / UPROPERTY / UFUNCTION 的东西生成「反射信息」。蓝图、存盘、垃圾回收、C# 都靠它。',{
  d:['UHT（Unreal Header Tool）生成 xxx.generated.h，所以 #include "xxx.generated.h" 必须是头文件里最后一个 include。',
     'GENERATED_BODY() 展开成构造函数声明、StaticClass() 等样板代码。',
     '没有反射的东西：蓝图看不见、不能存进资产、GC 不认识、C#（UnrealSharp）也看不见。',
     'UnrealSharp 的 C# 绑定（Glue）也是从反射信息生成的，所以要给 C# 调用的 C++ 函数必须是 UFUNCTION。'],
  code:[{t:'Game/Effect/System/WuwaEffectSystem.h（节选）',c:String.raw`#include "WuwaEffectSystem.generated.h"      // 必须最后

USTRUCT()
struct FWuwaActiveEffect
{
    GENERATED_BODY()
    UPROPERTY(Transient) TObjectPtr<UWuwaEffectSpec> Spec;
    UPROPERTY(Transient) TObjectPtr<UWuwaEffectSpecPool> Pool;
};

UCLASS()
class WUWA_API UWuwaEffectSystem : public UWorldSubsystem
{
    GENERATED_BODY()
public:
    UFUNCTION(BlueprintPure, Category = "Effect", meta = (WorldContext = "WorldContextObject"))
    static UWuwaEffectSystem* GetEffectSystem(const UObject* WorldContextObject);
    UFUNCTION(BlueprintCallable, Category = "Effect")
    FWuwaEffectHandle SpawnEffect(const FWuwaEffectSpawnRequest& Request);
    // ……
};`,n:['meta = (WorldContext = "WorldContextObject")：蓝图里调用时自动把当前对象填进这个参数，用户看不到这个引脚。','BlueprintPure：没有副作用的查询，蓝图里没有执行引脚；BlueprintCallable：有执行引脚。']}],
  qa:[['WUWA_API 是什么？','模块导出宏：让别的模块（比如编辑器模块 WuwaAnimationEditor）能链接这个类。不写的话别的模块用它会链接失败。'],
      ['类名为什么要加 U / A / F 前缀？','UE 约定，UHT 也会检查：U = UObject 派生，A = Actor，F = 普通结构体 / 类，T = 模板，E = 枚举，I = 接口。']]});
node('cr_uprop','cpp','UPROPERTY 与垃圾回收','UObject 由 UE 的垃圾回收（GC）管理：没人引用就被回收。GC 只认 UPROPERTY 标记的引用。',{
  d:['GC 定期从根对象出发，沿所有 UPROPERTY 指针走一遍，走不到的 UObject 被回收。',
     '所以 UObject 成员要写 UPROPERTY() TObjectPtr<T>：GC 知道你在用它（不会回收），对象被销毁时这个指针也会被清空。',
     '裸指针 T* 不加 UPROPERTY：GC 不知道，对象可能被回收，指针变野指针。',
     'Transient：不存盘（运行时才有的对象，比如正在播放的特效）。',
     'TObjectPtr<T> 是 UE5 推荐写法：编辑器里能做访问追踪和延迟加载，打包后和裸指针一样快。'],
  code:[{t:'Game/Effect/System/WuwaEffectSystem.h · private',c:String.raw`UPROPERTY(Transient)
TObjectPtr<UWuwaEffectSpecFactory> Factory;

UPROPERTY(Transient)
TMap<FGuid, FWuwaActiveEffect> ActiveEffects;   // 正在播放的特效：Spec + 借出它的池`,n:[]}],
  qa:[['FWuwaActiveEffect 为什么要是 USTRUCT、字段也加 UPROPERTY？','它放在 TMap 里，Map 是 UPROPERTY，GC 会顺着 Map 走进结构体，但只认结构体里标了 UPROPERTY 的字段。不标的话，正在播放的 Spec 可能被回收。'],
      ['普通 C++ 类（不是 UObject）要持有 UObject 怎么办？','用 TStrongObjectPtr，或者实现 FGCObject::AddReferencedObjects 手动报告给 GC。项目里一般直接放进某个 UObject 的 UPROPERTY。']]});
node('cr_weak','cpp','TWeakObjectPtr：只看不拥有','弱引用：能访问对象，但不阻止它被回收或销毁；对象没了之后 Get() 返回空、IsValid() 为 false。',{
  d:['原理：存的是对象在全局对象表里的编号 + 序列号。对象回收后编号可能被新对象复用，但序列号对不上，所以不会认错。',
     '什么时候用：只是「关心」某个对象，它的生死不归你管。比如 Actor 属于世界、组件属于 Actor、回调时对象可能已经没了。',
     '什么时候不用：你负责它的生命周期（自己 NewObject 的子对象），用 UPROPERTY 强引用。'],
  code:[{t:'三个例子',c:String.raw`// 1. 特效请求：Game/Effect/Types/WuwaEffectSpawnRequest.h
/** 留空则在世界中播放。弱引用避免播放请求延长场景组件的生命周期。 */
UPROPERTY(EditAnywhere, BlueprintReadWrite, Category = "Effect")
TWeakObjectPtr<USceneComponent> AttachTo;

// 2. 子系统看着世界里的 Actor：Game/Camera/WuwaSequenceCameraSubsystem.h
TWeakObjectPtr<ALevelSequenceActor> Sequence;
TWeakObjectPtr<AActor> CameraActor;
TWeakObjectPtr<ACharacter> Character;

// 3. 异步回调：Game/LGUI/Core/WuwaUiManager.cpp
TWeakObjectPtr<UWuwaUiManager> WeakThis(this);
Container->OpenView(View, [WeakThis, ViewId, ViewName](bool bSuccess)
{
    if (!bSuccess && WeakThis.IsValid()) WeakThis->ForgetView(ViewId);
});`,n:[]}],
  qa:[['特效请求里的 AttachTo 为什么用弱引用？','请求会被存起来（Group 里的子项、延迟播放）。强引用的话，角色已经销毁了，它的网格组件还因为被请求引用而不能回收。'],
      ['弱指针每次用都要判断吗？','要。习惯写法：if (AActor* A = Weak.Get()) { …在这里用 A… }。拿到的强指针只在这个作用域里用，不存下来。'],
      ['弱指针能放进 UPROPERTY 吗？','可以（上面例 1）。这样蓝图、序列化能看到它，GC 也不会因为它而保留对象。']]});
node('cr_soft','cpp','TSoftObjectPtr：只存路径','软引用只存资源路径，不加载；用到时同步或异步加载。用来切断「加载 A 连带加载 B、C、D」。',{
  d:['硬引用链：蒙太奇硬引用序列 → 序列硬引用特效 → 特效硬引用贴图……加载一个技能就把一大串读进内存。',
     '软引用切断这条链：DT_UiViews 里的 Prefab、序列镜头配置的 CameraSequence 都是软引用。',
     'LoadSynchronous()：立刻加载，会卡游戏线程。序列镜头目前直接用它（资源已在内存时几乎不花时间；第一次会卡一下，是可以改成预加载的点）。',
     '异步：UWuwaResourceSubsystem::LoadAsync（见 UI 制作 → 4. 写 View 类）。']});

  code:[{t:'Specs/Niagara/WuwaEffectNiagaraSpec.cpp',c:String.raw`// 先绑定再激活：系统可能在激活过程中同步结束。

node('cr_reentry','cpp','重入：回调里改了你正在用的数据','你调用的函数可能「同步」回调回来，改掉你正在用的容器或对象。特效系统有两处专门处理。',{
  code:[{t:'Game/Effect/System/WuwaEffectSystem.cpp',c:String.raw`// SpawnEffect：先登记再播放，使同步播放失败/结束也能通过同一回调正确释放。
ActiveEffects.Add(Handle.Id, {Spec, Pool});
Spec->OnFinished.BindUObject(this, &ThisClass::HandleFinished, Handle.Id);
if (!Spec->Play(Request))
{
    // Play 可能已同步 Finish 并归还，不能再操作这个已被回收的 Spec。
    if (ActiveEffects.Contains(Handle.Id)) { Spec->Stop(true); HandleFinished(Handle.Id); }
    return {};
}

// StopAllEffects：Stop 可同步回调 HandleFinished；先移出表，避免在遍历中修改同一容器。
auto StoppingEffects = MoveTemp(ActiveEffects);
for (const auto& Entry : StoppingEffects)
{
    Entry.Value.Spec->OnFinished.Unbind();
    Entry.Value.Spec->Stop(true);
    Entry.Value.Pool->Release(Entry.Value.Spec);
}`,n:[]}],
  qa:[['为什么要 MoveTemp(ActiveEffects)？','遍历 TMap 时如果回调里删了元素，迭代器失效（崩溃或漏处理）。先把整个 Map「搬」到局部变量，原来的变空，回调里再删也删不到正在遍历的这份。MoveTemp 是移动不是拷贝，没有开销。'],
      ['Play 失败时为什么还要检查 Contains？','Play 失败过程中可能已经同步 Finish → HandleFinished → 归还池子。这时再 Stop 一个已归还（甚至已被别人借走）的 Spec 就错了。']]});
node('cs_uclass','cs','UnrealSharp：[UClass] 与 partial','C# 类继承 C++ 反射类就成为真正的 UE 类（编辑器里能选、能存进资产）。写 partial 是因为另一半由 UnrealSharp 生成器生成。',{
  d:['[UClass]：登记成 UE 类。[UProperty(PropertyFlags.EditAnywhere)]：登记成 UE 属性，编辑器能改、能存盘。',
     '属性写成 partial { get; set; }：真正的存取代码由生成器生成，它直接读写这个对象在 C++ 内存里的那块数据，所以 C# 和 C++ 看到的是同一个值。',
     'Evaluate_Implementation：C++ 里 Evaluate 是 BlueprintNativeEvent，C# 重写它的 _Implementation，C++ 调 Evaluate() 时就会走到 C# 代码。'],
  code:[{t:'Script/.../Input/Conditions/InputCondition_OwnerTagCount.cs',c:String.raw`[UClass]
public partial class UInputCondition_OwnerTagCount : UWuwaInputCondition
{
    [UProperty(PropertyFlags.EditAnywhere)]
    public partial FGameplayTag Tag { get; set; }

    [UProperty(PropertyFlags.EditAnywhere)]
    public partial int Minimum { get; set; }

    [UProperty(PropertyFlags.EditAnywhere)]
    public partial int Maximum { get; set; }

    protected override bool Evaluate_Implementation(FWuwaInputCommandContext context)
    {
        if (!context.ASC.IsValid() || !Tag.IsValid) return false;
        int count = context.ASC.GetGameplayTagCount(Tag);
        return count >= Minimum && (Maximum < 0 || count <= Maximum);
    }
}`,n:[]},
     {t:'对应的 C++：Input/WuwaInputCommandConfig.h',c:String.raw`UCLASS(...)
class WUWA_API UWuwaInputCondition : public UObject
{
    GENERATED_BODY()
public:
    UFUNCTION(BlueprintPure, BlueprintNativeEvent, Category = "Wuwa|Combat|Input")
    bool Evaluate(const FWuwaInputCommandContext& Context) const;
};`,n:['BlueprintNativeEvent：C++ 声明一个函数，UHT 生成 Evaluate() 的调度代码；默认实现写在 Evaluate_Implementation，子类（蓝图或 C#）可以重写。']}],
  qa:[['C# 改完怎么生效？','重新编译并发布到 Binaries/Managed（跑测试前也要做）。C++ 新增了 UFUNCTION / UPROPERTY 还要重新生成 Glue，C# 才看得到。'],
      ['条件类为什么做成 UE 类，不用普通 C# 类？','它要作为规则表的一部分存进资产、在编辑器里配置（选 Tag、填数字），只有 UE 类能做到。纯计算的（预输入缓存、选招器）就用普通 C# 类。']]});
node('cs_sealed','cs','sealed / internal / readonly record struct','纯 C# 工具类（不是 UE 类）一般写成 internal sealed class；小数据写成 readonly record struct。',{
  d:['sealed：这个类不能被继承。表达「不是为扩展设计的」，读代码的人不用担心子类改了行为；JIT 也能把虚调用直接内联（小幅提速）。',
     'internal：只在本程序集（ManagedWuwa）里可见，不暴露给其他程序集。',
     'readonly record struct：值类型（放进 List 不额外分配对象）、字段不可变、自动生成按值比较和 ToString。一条预输入存进去就不会再改，正合适。',
     'static lambda（new(static owner => owner.IsValid)）：禁止捕获任何变量，编译器保证不会意外捕获 this，也不会每次分配闭包。',
     '主构造函数 class WuwaOwnedRequests<TOwner, TValue>(Func<TOwner, bool> isOwnerValid)：C# 12 写法，参数在整个类里直接可用。'],
  code:[{t:'Script/.../Input/CombatInputBuffer.cs',c:String.raw`internal readonly record struct WuwaBufferedCombatInput(
    FGameplayTag InputTag, EWuwaInputPhase Phase, double InputTimeSeconds, double ExpiresAtSeconds);

// 缓存原始指令。断点时重新解释，选一条提交后清整批，不是按队列依次执行。
internal sealed class CombatInputBuffer
{
    private readonly List<WuwaBufferedCombatInput> _items = new();
    public bool Store(FWuwaInputEvent input, double nowSeconds, double lifetimeSeconds)
    {
        if (input.Phase != EWuwaInputPhase.Pressed || !input.InputTag.IsValid
            || !double.IsFinite(input.Timestamp) /* …… */) return false;
        Prune(nowSeconds);
        _items.Add(new(input.InputTag, input.Phase, input.Timestamp, nowSeconds + lifetimeSeconds));
        return true;
    }
}`,n:['private readonly List：readonly 只是「这个字段不能再指向别的 List」，List 里的内容照样能增删。']},
     {t:'Script/.../Camera/WuwaOwnedRequests.cs + WuwaCameraRuntime.cs',c:String.raw`internal sealed class WuwaOwnedRequests<TOwner, TValue>(Func<TOwner, bool> isOwnerValid)
{
    private readonly record struct Request(int Handle, TOwner Owner, TValue Value, int Priority);
    public int Add(TOwner owner, TValue value, int priority)
    {
        // 不循环使用句柄：迟到的退出请求不能误删后来创建的模式。
        if (!isOwnerValid(owner) || _lastIssuedHandle == int.MaxValue) return 0;
        int handle = ++_lastIssuedHandle;
        _requests.Add(new Request(handle, owner, value, priority));
        return handle;
    }
}

// 使用方：来源是 UE 对象的弱指针，有效性交给 IsValid
private readonly WuwaOwnedRequests<TWeakObjectPtr<UObject>, FWuwaCameraSettings> _modes

  qa:[['UE 类（[UClass]）为什么不写 sealed？','UE 类要允许蓝图或别的类继承（编辑器里可能基于它建蓝图），生成器生成的另一半也需要正常的类结构。'],

node('cs_bridge','cs','C++ Bridge + C# 实现','C++ 组件声明 BlueprintNativeEvent 接口和数据，C# 子类重写实现。C++ 其他代码只调 C++ 接口，不知道背后是 C#。',{

node('cg_life','cpp','GAS：GA 生命周期与蒙太奇实例','Activate → 任务 → EndAbility。多处结束入口要防重复；蒙太奇淡出时可以单独关掉它的根运动。',{

node('ce_notify','tool','编辑器 API：通知的触发偏移','代码加通知后要调用 RefreshTriggerOffset，否则放在第 0 帧（片段开头）的通知不会触发。',{

 ['GameplayTag','层级式的状态标签，如 State.Position.Ground。用来表示「现在处于什么状态」。'],
 ['蒙太奇 Montage','可以在动画蓝图之上插播的动画片段，带分段和通知轨道。技能动作都是蒙太奇。'],
 ['动画通知 Notify','蒙太奇时间轴上的事件点：到了某帧执行代码。NotifyState 是持续一段时间的版本。'],
 ['根运动 Root Motion','动画自己带位移，角色的移动由动画决定。'],
 ['ABP 动画蓝图','决定角色平时播什么动画（走、跑、跳）的状态机资产。'],
 ['CMC 移动组件','CharacterMovementComponent，负责角色的物理移动。'],
 ['Possess 附身','PlayerController 控制某个角色。切人就是换一个角色附身。'],
 ['Subsystem 子系统','UE 里自动创建的单例服务，按生命周期分 World / LocalPlayer / Engine 等。'],
 ['DataTable 数据表','UE 里的表格资产，每行一个结构体。技能表、子弹表、伤害表都是。'],
 ['Commandlet','不打开编辑器界面、在命令行运行的 UE 程序，用来批量改资产。'],
 ['Niagara','UE 的粒子特效系统。'],
 ['LevelSequence','UE 的时间轴动画资产（Sequencer），做过场 / 镜头。'],
 ['Possessable / Spawnable','序列里「借用场景已有对象」/「序列自己生成对象」。'],
 ['LGUI / Prefab','原作同款 UI 插件；Prefab 是一棵界面节点树模板。'],
 ['MVC','Model（数据）/ View（显示）/ Controller（逻辑）分开，互相通过事件联系。'],
 ['UnrealSharp','让 C# 写 UE 逻辑的插件。项目里 C# 负责规则判断。'],
 ['Bridge 桥','项目的模式：C++ 组件提供反射和快照，C# 子类实现规则。'],
 ['PakExport','项目自带的命令行版 FModel，用来导出原作资源。'],
 ['配方 recipe','Python 脚本输出的 JSON，描述要在 UE 里建什么，Commandlet 照着做。'],
 ['原作 → 改成','标记项目和原作结构不同的地方以及理由。']
];

/* ---------- 渲染 ---------- */
const $ = s=>document.querySelector(s);
const boardEl=$('#board'), headEl=$('#head'), crumbsEl=$('#crumbs'), panel=$('#panel'), pbody=$('#pbody'), ptitle=$('#ptitle'), scrim=$('#scrim');
const PARENT = {};      // board -> {board, node}
for(const [bid,b] of Object.entries(B)) for(const [,ids] of b.rows) for(const id of ids){ const c=N[id]&&N[id].c; if(c && !PARENT[c]) PARENT[c]={board:bid,node:id}; }
let cur='root';

function kv(k){ return 'var('+(KINDS[k]||KINDS.concept).v+')'; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function path(bid){ const p=[]; let x=bid; while(x){ p.unshift(x); x=PARENT[x]&&PARENT[x].board; } return p; }

function renderLegend(){
  $('#legend').innerHTML = Object.entries(KINDS).map(([k,o])=>'<span><i style="background:'+kv(k)+'"></i>'+o.t+'</span>').join('')
    + '<span>— 箭头 = 「A 用到 / 交给 B」；虚线 = 回头 / 循环</span>';
}

function go(bid, push=true){
  if(!B[bid]) bid='root';
  cur=bid; closePanel();
  if(push){ try{ history.replaceState(null,'','#'+bid); }catch(e){} }
  const b=B[bid], p=path(bid);
  crumbsEl.innerHTML = p.map((id,i)=> (i?'<span class="sep">›</span>':'') + '<button class="'+(i===p.length-1?'cur':'')+'" data-b="'+id+'">'+esc(B[id].t)+'</button>').join('');
  crumbsEl.querySelectorAll('button').forEach(x=>x.onclick=()=>{ if(x.dataset.b!==cur) go(x.dataset.b); });
  const par=PARENT[bid], pn=par&&N[par.node];
  let h='<h1>'+(par?'<button class="backbtn" data-b="'+par.board+'">‹ 上一层</button>':'')+esc(b.t)+'</h1><p class="intro">'+b.intro+'</p>'
      +'<p class="how">怎么看：带红色「进入下一层」的块点进去还有细节；其他块点一下右侧会弹出说明。鼠标停在块上会高亮它的连线。</p>';
  if(pn && (pn.d||pn.f||pn.dev||pn.qa||pn.code)) h+='<details><summary>这一层的补充说明</summary>'+detailHtml(pn)+'</details>';
  headEl.innerHTML=h;
  const bb=headEl.querySelector('.backbtn'); if(bb) bb.onclick=()=>go(bb.dataset.b);

  boardEl.innerHTML='<svg class="wires" id="wires"></svg>';
  b.rows.forEach(([label,ids])=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML='<div class="rlabel">'+esc(label)+'</div><div class="nodes"></div>';
    const wrap=row.querySelector('.nodes');
    ids.forEach(id=>{
      const n=N[id]; if(!n) return;
      const el=document.createElement('button'); el.className='card'+(n.k==='concept'&&n.d&&n.d.length>2?' wide':''); el.dataset.id=id;
      el.style.setProperty('--kc', kv(n.c?'group':n.k));
      el.innerHTML='<div class="kind">'+(KINDS[n.k]||KINDS.concept).t+'</div><div class="name">'+esc(n.n)+'</div><div class="what">'+esc(n.w)+'</div>'
        +(n.c?'<span class="drill">进入下一层 ›</span>':((n.code||n.steps||n.qa)?'<div class="info">点开看步骤 / 代码 / 问答 ⓘ</div>':(n.d||n.f||n.dev)?'<div class="info">点开看细节 ⓘ</div>':''));
      el.onclick=()=>{ if(n.c) go(n.c); else openNode(id); };
      el.onmouseenter=()=>hl(id); el.onmouseleave=()=>hl(null);
      el.onfocus=()=>hl(id); el.onblur=()=>hl(null);
      wrap.appendChild(el);
    });
    boardEl.appendChild(row);
  });
  window.scrollTo({top:0});
  requestAnimationFrame(drawWires);
}

function drawWires(){
  const svg=$('#wires'); if(!svg) return;
  const b=B[cur], br=boardEl.getBoundingClientRect();
  const R={}; boardEl.querySelectorAll('.card').forEach(el=>{ const r=el.getBoundingClientRect(); R[el.dataset.id]={x:r.left-br.left,y:r.top-br.top,w:r.width,h:r.height}; });
  const E=b.e.filter(e=>R[e[0]]&&R[e[1]]).map(([a,c,l,st],i)=>{
    const A=R[a],C=R[c]; let dir;
    if(A.y+A.h < C.y-4) dir='down'; else if(C.y+C.h < A.y-4) dir='up'; else dir='side';
    return {i,a,c,l,st,A,C,dir};
  });
  // 分配端口：同一个块同一侧的多条线按另一端的 x 排开
  const ports={};
  const addPort=(id,side,e,other)=>{ (ports[id+side]=ports[id+side]||[]).push({e,other}); };
  E.forEach(e=>{
    if(e.dir==='down'){ addPort(e.a,'b',e,e.C.x+e.C.w/2); addPort(e.c,'t',e,e.A.x+e.A.w/2); }
    else if(e.dir==='up'){ addPort(e.a,'t',e,e.C.x+e.C.w/2); addPort(e.c,'b',e,e.A.x+e.A.w/2); }
    else { addPort(e.a,'t',e,e.C.x); addPort(e.c,'t',e,e.A.x); }
  });
  const px={};
  for(const [key,list] of Object.entries(ports)){
    const id=key.slice(0,-1); const r=R[id]; list.sort((p,q)=>p.other-q.other);
    list.forEach((p,i)=>{ const f=list.length===1?.5:.25+.5*i/(list.length-1); px[p.e.i+'|'+id]=r.x+r.w*f; });
  }
  let s='<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>'
       +'<marker id="mkon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkon" d="M0,0 L10,5 L0,10 z"/></marker></defs>';
  const laneN={l:0,r:0}, labels=[];
  E.forEach(e=>{
    const A=e.A,C=e.C; let x1,y1,x2,y2,c1x,c1y,c2x,c2y;
    const sx=px[e.i+'|'+e.a], tx=px[e.i+'|'+e.c];
    // 跨行的线如果会穿过中间的块，就绕到两侧的通道里走
    if(e.dir!=='side' && e.st!=='back'){
      const top=e.dir==='down'?A.y+A.h:C.y+C.h, bot=e.dir==='down'?C.y:A.y;
      const mid=Object.entries(R).filter(([id,r])=>id!==e.a&&id!==e.c&&r.y>top&&r.y+r.h<bot);
      const lo=Math.min(sx,tx)-14, hi=Math.max(sx,tx)+14;
      if(mid.some(([,r])=>r.x<hi&&r.x+r.w>lo)){
        const L=Math.min(...mid.map(([,r])=>r.x)), Rr=Math.max(...mid.map(([,r])=>r.x+r.w)), cx=(sx+tx)/2;
        const left=(cx-L)<(Rr-cx), lane=left?L-26-14*laneN.l++:Rr+26+14*laneN.r++;
        const ya=e.dir==='down'?A.y+A.h:A.y, yb=e.dir==='down'?C.y:C.y+C.h, sg=e.dir==='down'?1:-1, k=22;
        const d='M'+sx+','+ya+' C'+sx+','+(ya+sg*k)+' '+lane+','+(ya+sg*k)+' '+lane+','+(ya+sg*2*k)
               +' L'+lane+','+(yb-sg*2*k)+' C'+lane+','+(yb-sg*k)+' '+tx+','+(yb-sg*k)+' '+tx+','+yb;
        s+='<path data-a="'+e.a+'" data-c="'+e.c+'" d="'+d+'" marker-end="url(#mk)"/>';
        if(e.l) labels.push({e,x:left?lane-6:lane+6,y:(ya+yb)/2,anchor:left?'end':'start'});
        return;
      }
    }
    if(e.dir==='down'){ x1=sx;y1=A.y+A.h;x2=tx;y2=C.y; const d=Math.max(26,(y2-y1)/2); c1x=x1;c1y=y1+d;c2x=x2;c2y=y2-d; }
    else if(e.dir==='up'){ x1=sx;y1=A.y;x2=tx;y2=C.y+C.h; const d=Math.max(40,(y1-y2)/2); c1x=x1;c1y=y1-d;c2x=x2;c2y=y2+d;
      if(e.st==='back'){ // 绕到右侧
        const side=Math.max(A.x+A.w,C.x+C.w)+46; x1=A.x+A.w;y1=A.y+A.h/2;x2=C.x+C.w;y2=C.y+C.h/2; c1x=side;c1y=y1;c2x=side;c2y=y2; }
    }
    else { x1=sx;y1=A.y;x2=tx;y2=C.y; const lift=Math.min(52,30+Math.abs(x2-x1)/14); c1x=x1;c1y=y1-lift;c2x=x2;c2y=y2-lift; }
    const d='M'+x1+','+y1+' C'+c1x+','+c1y+' '+c2x+','+c2y+' '+x2+','+y2;
    s+='<path data-a="'+e.a+'" data-c="'+e.c+'" class="'+(e.st==='back'?'back':'')+'" d="'+d+'" marker-end="url(#mk)"/>';
    if(e.l) labels.push({e,x:(x1+3*c1x+3*c2x+x2)/8,y:(y1+3*c1y+3*c2y+y2)/8+4,anchor:'middle'});
  });
  // 标签避让：和已放的标签、卡片重叠就上下挪，挪不开就只在高亮时显示
  const boxes=Object.values(R).map(r=>({x:r.x-2,y:r.y-2,w:r.w+4,h:r.h+4}));
  const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  labels.forEach(L=>{
    const w=[...L.e.l].reduce((t,ch)=>t+(ch.charCodeAt(0)>255?11:6.2),0)+6, h=14;
    const bx=L.anchor==='middle'?L.x-w/2:L.anchor==='end'?L.x-w:L.x;
    let ok=null;
    for(const dy of [0,-13,13,-26,26]){ const b={x:bx,y:L.y+dy-11,w,h}; if(!boxes.some(o=>hit(o,b))){ ok=dy; boxes.push(b); break; } }
    s+='<text data-a="'+L.e.a+'" data-c="'+L.e.c+'" class="'+(ok===null?'hid':'')+'" x="'+L.x+'" y="'+(L.y+(ok||0))+'" text-anchor="'+L.anchor+'">'+esc(L.e.l)+'</text>';
  });
  svg.innerHTML=s;
}

function hl(id){
  const svg=$('#wires'); if(!svg) return;
  svg.querySelectorAll('path[data-a],text').forEach(el=>{
    const on = id && (el.dataset.a===id||el.dataset.c===id);
    el.classList.toggle('on',!!on); el.classList.toggle('dim',!!id&&!on);
    if(el.tagName==='path') el.setAttribute('marker-end', on?'url(#mkon)':'url(#mk)');
  });
}

function detailHtml(n){
  let h='';
  if(n.d&&n.d.length) h+='<h3>它是怎么工作的</h3>'+(n.d.length===1?'<p>'+esc(n.d[0])+'</p>':'<ul>'+n.d.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
  if(n.steps&&n.steps.length) h+='<h3>在 UE 里怎么做</h3><ol>'+n.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
  if(n.api&&n.api.length) h+='<h3>用到的 API（代码里调的是什么）</h3><div class="api">'+n.api.map(([a,b])=>'<div><code>'+esc(a)+'</code><br>'+esc(b)+'</div>').join('')+'</div>';
  if(n.code&&n.code.length) h+='<h3>项目里的代码</h3>'+n.code.map(c=>'<div class="cb"><div class="ct">'+esc(c.t)+'</div><pre>'+esc(c.c)+'</pre>'+(c.n&&c.n.length?'<ul>'+c.n.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'</div>').join('');
  if(n.qa&&n.qa.length) h+='<h3>初学者常问</h3>'+n.qa.map(([q,a])=>'<div class="qa"><div class="q">问：'+esc(q)+'</div><div>答：'+esc(a)+'</div></div>').join('');
  if(n.dev) h+='<div class="dev">'+n.dev+'</div>';
  if(n.f&&n.f.length) h+='<h3>代码 / 资产在哪</h3><div class="files">'+n.f.map(x=>'<code>'+esc(x)+'</code>').join('')+'</div>';
  return h;
}

function openNode(id){
  const n=N[id], b=B[cur];
  boardEl.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
  ptitle.textContent=n.n;
  let h='<span class="kchip" style="--kc:'+kv(n.k)+'">'+(KINDS[n.k]||KINDS.concept).t+'</span><p><b>一句话：</b>'+esc(n.w)+'</p>'+detailHtml(n);
  const ins=b.e.filter(e=>e[1]===id), outs=b.e.filter(e=>e[0]===id);
  if(ins.length||outs.length){
    h+='<h3>在这一层的依赖关系</h3><ul class="deps">';
    ins.forEach(e=>h+='<li>来自 <button data-n="'+e[0]+'">'+esc(N[e[0]].n)+'</button>'+(e[2]?'：'+esc(e[2]):'')+'</li>');
    outs.forEach(e=>h+='<li>交给 <button data-n="'+e[1]+'">'+esc(N[e[1]].n)+'</button>'+(e[2]?'：'+esc(e[2]):'')+'</li>');
    h+='</ul>';
  }
  pbody.innerHTML=h;
  pbody.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{ const t=N[x.dataset.n]; if(t.c) go(t.c); else openNode(t.id); });
  panel.classList.add('open'); scrim.classList.add('open'); hl(id);
}
function openGloss(){
  ptitle.textContent='术语小词典';
  pbody.innerHTML='<p>第一次看遇到不认识的词，先查这里。</p><dl class="gl">'+GLOSS.map(([a,b])=>'<dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd>').join('')+'</dl>';
  panel.classList.add('open'); scrim.classList.add('open');
}
function closePanel(){ panel.classList.remove('open'); scrim.classList.remove('open'); boardEl.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel')); hl(null); }
$('#pclose').onclick=closePanel; scrim.onclick=closePanel; $('#glossBtn').onclick=openGloss;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });
new ResizeObserver(()=>requestAnimationFrame(drawWires)).observe(boardEl);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==cur&&B[h]) go(h,false); });
renderLegend();
let start='root'; try{ const h=location.hash.slice(1); if(B[h]) start=h; }catch(e){}
go(start,false);
</script>
</body>
</html>
