[SystemSettings]
; Niagara 特效不进硬件光追场景：开着时特效第一次出现，渲染线程要在 RayTracing_GatherDynamicRayTracingInstances 里现编材质的光追着色器（首次放技能卡约 50ms）。
; 原作特效也不参与光追；Lumen 本来就不吃半透明特效，关掉只影响光追反射里看不到特效。
r.RayTracing.Geometry.NiagaraSprites=0
r.RayTracing.Geometry.NiagaraRibbons=0
r.RayTracing.Geometry.NiagaraMeshes=0
; 关掉 UE5 的“对焦距离之后的 AfterDOF 半透明自动挪到 DOF 前”（负值 = 关）：大招镜头有景深，背景特效（长离大招画卷）会被挪进 DOF 前、
; 被电影后处理的环境压黑（BeforeDOF）一起压掉。原作（UE4.26）没有这个机制，特效始终在 DOF 之后合成。
r.Translucency.AutoBeforeDOF=-1

